[tool.poetry]
name = "proxim-agent"
version = "0.1.0"
description = "Proxim LangGraph job discovery agent"
authors = ["Manav Ghosh"]
python = ">=3.11"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
langgraph = "^0.4"
litellm = "^1.40"
asyncpg = "^0.29"
pydantic = "^2.7"
pydantic-settings = "^2.2"
playwright = "^1.44"
playwright-stealth = "^1.0"
beautifulsoup4 = "^4.12"
requests = "^2.31"
rapidfuzz = "^3.6"
structlog = "^24.1"
langsmith = "^0.1"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.30"}

[tool.poetry.dev-dependencies]
pytest = "^8"
pytest-asyncio = "^0.23"
pytest-cov = "^5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
