[tool.poetry]
name = "proxim-agent"
version = "0.1.0"
description = "Proxim LangGraph job discovery agent"
authors = ["Manav Ghosh"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
langgraph = "^1.0"
litellm = "^1.40"
asyncpg = "^0.31"
pydantic = "^2.7"
pydantic-settings = "^2.2"
playwright = "^1.44"
playwright-stealth = "^1.0"
beautifulsoup4 = "^4.12"
requests = "^2.31"
rapidfuzz = "^3.6"
structlog = "^24.1"
langsmith = ">=0.3.45"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.30"}
aiosqlite = "^0.22.1"
setuptools = "^82.0.1"
jinja2 = "^3.1"
pdfplumber = "^0.11"
xhtml2pdf = "^0.2.17"
exa-py = "^2.12.1"
httpx = "^0.28"
google-api-python-client = "^2.130"
google-auth = "^2.30"
google-auth-oauthlib = "^1.2"
# langfuse removed: SDK is incompatible with Python 3.14 (Fern-generated code
# uses UniversalBaseModel / pydantic_v1 shim which breaks on 3.14). Cost tracking
# is handled via OTel (telemetry.py) instead.
opentelemetry-sdk = ">=1.27"
opentelemetry-exporter-otlp-proto-grpc = ">=1.27"
opentelemetry-instrumentation-httpx = {version = ">=0.48b0", allow-prereleases = true}

[tool.poetry.group.dev.dependencies]
pytest = "^8"
pytest-asyncio = "^0.23"
pytest-cov = "^5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
